name: Build FunkinAI

on:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7

      - name: Cache haxelib
        uses: actions/cache@v4
        with:
          path: ~\haxelib
          key: haxelib-windows-${{ hashFiles('**/Project.xml') }}
          restore-keys: haxelib-windows-

      - name: Install libraries
        run: |
          haxelib setup ~\haxelib
          haxelib install lime         8.1.3 --quiet
          haxelib install openfl        9.3.3 --quiet
          haxelib install flixel        5.8.0 --quiet
          haxelib install flixel-addons 4.0.1 --quiet
          haxelib install flixel-ui     2.6.1 --quiet
          haxelib install hscript       2.5.0 --quiet
          haxelib run lime setup

      - name: Write API key config
        shell: bash
        env:
          FUNKINAI_KEY: ${{ secrets.FUNKINAI_KEY }}
        run: |
          if [ -n "$FUNKINAI_KEY" ]; then
            echo "{\"apiKey\":\"$FUNKINAI_KEY\"}" > funkinai.json
          fi

      - name: Build Windows
        run: haxelib run lime build windows -release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FunkinAI-Windows
          path: export/release/windows/bin
          retention-days: 30

  build-android:
    name: Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7

      - name: Cache haxelib
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: haxelib-android-${{ hashFiles('**/Project.xml') }}
          restore-keys: haxelib-android-

      - name: Install libraries
        run: |
          haxelib setup ~/haxelib
          haxelib install lime         8.3.1 --quiet
          haxelib install openfl        9.4.1 --quiet
          haxelib install flixel        6.1.2 --quiet
          haxelib install flixel-addons 4.0.1 --quiet
          haxelib install flixel-ui     2.6.1 --quiet
          haxelib install hscript       2.5.0 --quiet
          haxelib run lime setup

      - name: Configure Lime Android
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_HOME/ndk-bundle
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_X64

      - name: Write API key config
        env:
          FUNKINAI_KEY: ${{ secrets.FUNKINAI_KEY }}
        run: |
          if [ -n "$FUNKINAI_KEY" ]; then
            echo "{\"apiKey\":\"$FUNKINAI_KEY\"}" > funkinai.json
          fi

      - name: Build Android
        run: haxelib run lime build android -release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FunkinAI-Android
          path: export/android/bin/app/build/outputs/apk/release/
          retention-days: 30

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: FunkinAI-Windows
          path: dist/windows

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: FunkinAI-Android
          path: dist/android

      - name: Zip Windows release
        run: |
          cd dist/windows
          zip -r ../../FunkinAI-Windows-${{ github.ref_name }}.zip .

      - name: Copy Android APK
        run: |
          find dist/android/ -name "*.apk" -exec cp {} ./FunkinAI-Android-${{ github.ref_name }}.apk \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: FunkinAI ${{ github.ref_name }}
          files: |
            FunkinAI-Windows-${{ github.ref_name }}.zip
            FunkinAI-Android-${{ github.ref_name }}.apk
          generate_release_notes: true
